name: Validate tvOS patcher
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test validation and unsafe input rejection
        run: python3 -m unittest discover -s tests -v
      - name: Build real tvOS framework
        run: bash scripts/build.sh
      - name: Test both purchase hooks together
        run: |
          xcrun clang++ -fobjc-arc -framework Foundation tests/runtime.mm -o build/runtime-test
          build/runtime-test
      - name: Test real tvOS IPA patching and re-signing
        run: python3 tests/smoke.py
      - name: Save synthetic fixtures for workflow testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-tvos-fixtures
          path: |
            build/smoke/Synthetic_tvOS_input.ipa
            build/smoke/Synthetic_tvOS_patched.ipa
          retention-days: 1
          if-no-files-found: error
